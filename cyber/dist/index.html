    <style>
      /* Critical above-fold CSS — prevents FOUC */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #000; color: #e4e4e7; }
      body { font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden;

      #root { min-height: 100dvh; }

      /* Initial loading state shown before React mounts */
      #app-loader {
        position: fixed; inset: 0; background: #000;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #app-loader.hidden { opacity: 0; pointer-events: none; }
      #app-loader-shield {
        width: 56px; height: 56px;
        background: linear-gradient(135deg, #f97316, #ef4444);
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; color: #fff; font-size: 18px; letter-spacing: -1px;
        animation: loaderPulse 1.6s ease-in-out infinite;
      }
      #app-loader p {
        font-size: 10px; font-weight: 700; letter-spacing: 4px;
        text-transform: uppercase; color: #52525b;
      }
      @keyframes loaderPulse {
        0%,100% { box-shadow: 0 0 0 0 rgba(249,115,22,0); transform: scale(1); }
        50%      { box-shadow: 0 0 0 12px rgba(249,115,22,0.15); transform: scale(1.05); }
      }

  <body>
    <!-- Pre-React loader (hidden once React mounts) -->
    <div id="app-loader">
      <div id="app-loader-shield">CC</div>
      <p>CrimeCast</p>
    </div>

    <div id="root"></div>

    <script>
      // Hide loader once React has rendered
      document.addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(() => {
          if (document.querySelector('#root > *')) {
            const loader = document.getElementById('app-loader');
            if (loader) {
              loader.classList.add('hidden');
              setTimeout(() => loader.remove(), 500);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
