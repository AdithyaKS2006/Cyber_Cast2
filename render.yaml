services:
  # CrimeCast Backend API (Daphne ASGI Server)
  - type: web
    name: cybercast-backend
    runtime: python
    plan: free
    rootDir: cyber
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py migrate --run-syncdb -v 0 && python demo/seed_demo_data.py && python manage.py collectstatic --noinput"
    startCommand: "daphne -b 0.0.0.0 -p $PORT crimecast.asgi:application"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JWT_COOKIE_SAMESITE
        value: "None"
      - key: JWT_COOKIE_SECURE
        value: "True"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # CrimeCast Frontend Web Interface
  - type: web
    name: cybercast-frontend
    runtime: static
    plan: free
    rootDir: cyber
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_PATH
        value: "/"
      - key: VITE_API_URL
        sync: false
        value: "https://cybercast-backend.onrender.com"
